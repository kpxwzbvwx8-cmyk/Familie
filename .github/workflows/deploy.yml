# Veröffentlicht die Familien-App:
#  1. Supabase: Datenbank-Migrationen + Edge Functions (push, ics)
#  2. GitHub Pages: die Web-App aus ./public
#
# Benötigte Einstellungen im Repository (Settings → Secrets and variables → Actions):
#   Variables: SUPABASE_PROJECT_REF, SUPABASE_KEY (Publishable/anon key)
#   Secrets:   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
name: Veröffentlichen

on:
  # Nur der Haupt-Branch wird veröffentlicht. Neue Änderungen liegen zuerst auf „entwicklung“
  # und kommen erst nach Freigabe hierher.
  push:
    branches: [claude/neue-app-trainerkarte-l4wvdd]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  supabase:
    name: Supabase aktualisieren
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Einstellungen prüfen
        env:
          PRIVACY_CONTROLLER: ${{ vars.PRIVACY_CONTROLLER }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          TEAM_MASCOT_FAMILY_CODE: ${{ secrets.TEAM_MASCOT_FAMILY_CODE }}
        run: |
          missing=""
          [ -n "$PRIVACY_CONTROLLER" ] || missing="$missing PRIVACY_CONTROLLER"
          [ -n "$PRIVACY_CONTACT" ] || missing="$missing PRIVACY_CONTACT"
          [ -n "$TEAM_MASCOT_FAMILY_CODE" ] || missing="$missing TEAM_MASCOT_FAMILY_CODE(Secret)"
          [ -n "$PROJECT_REF" ] || missing="$missing SUPABASE_PROJECT_REF(Variable)"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN(Secret)"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD(Secret)"
          if [ -n "$missing" ]; then echo "::error::Es fehlen:$missing – siehe README"; exit 1; fi
      - run: npm ci
      - name: Mit Supabase-Projekt verbinden
        run: npx supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      # Familienzugriffe in Push und Kalender begrenzen, bevor neue Codes zugelassen werden.
      - name: Edge Functions veröffentlichen
        run: npx supabase functions deploy push ics tick hsv pair --project-ref "$PROJECT_REF" --use-api
      - name: Datenbank aktualisieren
        run: npx supabase db push --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Team-Maskottchen ihrer Familie zuordnen
        env:
          TEAM_MASCOT_FAMILY_CODE: ${{ secrets.TEAM_MASCOT_FAMILY_CODE }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          db_url="postgresql://postgres@db.${PROJECT_REF}.supabase.co:5432/postgres"
          if [ -s supabase/.temp/pooler-url ]; then db_url="$(cat supabase/.temp/pooler-url)"; fi
          node scripts/configure-mascots.js "$db_url"

  pages:
    needs: supabase
    name: Web-App veröffentlichen
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: config.js erzeugen
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
          PRIVACY_CONTROLLER: ${{ vars.PRIVACY_CONTROLLER }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          PRIVACY_RETENTION: ${{ vars.PRIVACY_RETENTION }}
          PRIVACY_TRANSFERS: ${{ vars.PRIVACY_TRANSFERS }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Variablen SUPABASE_PROJECT_REF und SUPABASE_KEY fehlen – siehe README"; exit 1
          fi
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const e = process.env;
          const config = {
            supabaseUrl: `https://${e.PROJECT_REF}.supabase.co`,
            supabaseKey: e.SUPABASE_KEY,
            version: e.GITHUB_SHA.slice(0, 8),
            privacy: { controller: e.PRIVACY_CONTROLLER, contact: e.PRIVACY_CONTACT,
              retention: e.PRIVACY_RETENTION, transfers: e.PRIVACY_TRANSFERS },
          };
          writeFileSync('public/config.js', 'window.FAMILIE_CONFIG = ' + JSON.stringify(config) + ';\n');
          JS
          # Cache-Version des Service Workers pro Veröffentlichung erneuern
          sed -i "s/const CACHE = 'familie-[^']*'/const CACHE = 'familie-${GITHUB_SHA::8}'/" public/sw.js
          # App-Dateien mit Versionsanhang einbinden, damit das Handy keine alten Dateien nimmt
          sed -i -E "s/(app\.css|app\.js|config\.js)\"/\1?v=${GITHUB_SHA::8}\"/g" public/index.html
          grep -n '?v=' public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
