<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Familie">
  <title>Familie</title>
  <script>
    // Gewähltes Farbschema vor dem ersten Zeichnen setzen (verhindert Aufblitzen)
    try { var t = localStorage.getItem('familie.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/pokemon-ds.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/pokemon-solid.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <h1 id="tab-title">Start</h1>
    <button id="update-btn" class="update-ball" type="button" aria-label="Nach Updates suchen" title="Nach Updates suchen">
      <span class="ball-sprite" aria-hidden="true"></span>
    </button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" aria-label="Neue Nachricht" hidden>+</button>

  <!-- X-Knopf wie beim Nintendo DS: öffnet das Menü -->
  <button id="menu-btn" class="x-btn" type="button" aria-label="Menü öffnen" aria-expanded="false" aria-controls="menu">
    <span>X</span>
  </button>

  <div id="menu-backdrop" class="menu-backdrop" hidden></div>
  <div id="menu" class="ds-menu" role="dialog" aria-modal="true" aria-label="Menü" hidden>
    <section class="ds-panel">
      <div class="ds-panel-head"><span class="x-mini" aria-hidden="true">X</span>Menü</div>
      <div class="ds-grid">
        <button type="button" class="ds-item" data-go="start" style="--i:0"><img src="img/menu/dex.png" alt=""><span>Austausch</span></button>
        <button type="button" class="ds-item" data-go="profil" style="--i:1"><img src="img/menu/card.png" alt=""><span id="menu-me">Profil</span></button>
        <button type="button" class="ds-item" data-go="team" style="--i:2"><img src="img/menu/ball.png" alt=""><span>Team</span></button>
        <button type="button" class="ds-item" data-go="notizen" style="--i:3"><img src="img/menu/save.png" alt=""><span>Notizen</span></button>
        <button type="button" class="ds-item" data-go="kalender" style="--i:4"><img src="img/menu/cal.png" alt=""><span>Kalender</span></button>
        <button type="button" class="ds-item" data-go="einstellungen" style="--i:5"><img src="img/menu/opt.png" alt=""><span>Einstellungen</span></button>
        <button type="button" class="ds-item" data-go="schande" style="--i:6"><img src="img/menu/gear.png" alt=""><span>Board der Schande</span></button>
        <div class="ds-item ds-free" style="--i:7" aria-hidden="true"></div>
      </div>
    </section>
    <section class="ds-side">
      <div class="ds-box ds-blue" style="--i:8" aria-hidden="true"><span class="ds-key">Y</span><img src="img/menu/bike.png" alt=""></div>
      <div class="ds-box ds-blue" style="--i:9" aria-hidden="true"><img src="img/menu/item.png" alt=""></div>
      <div class="ds-box ds-free" style="--i:10" aria-hidden="true"></div>
      <button type="button" id="menu-back" class="ds-box ds-red" style="--i:11"><span class="ds-key ds-key-a">A</span><span>Zurück</span></button>
    </section>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
