<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d63b3b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Familie">
  <title>Familie</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <span class="logo-ball" aria-hidden="true"></span>
      <h1 id="tab-title">Austausch</h1>
    </div>
    <button id="profile-btn" class="profile-btn" type="button" aria-label="Mein Trainerpass" hidden></button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <button id="fab" class="fab" type="button" aria-label="Neue Nachricht" hidden>+</button>

  <nav class="tabbar" aria-label="Bereiche">
    <button type="button" data-tab="austausch">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v10H8l-4 4z"/></svg>
      <span>Austausch</span>
    </button>
    <button type="button" data-tab="notizen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>
      <span>Notizen</span>
    </button>
    <button type="button" data-tab="kalender">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>
      <span>Kalender</span>
    </button>
    <button type="button" data-tab="schande">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8v8M11 8v8M14 8v8M7 15l10-6"/></svg>
      <span>Schande</span>
    </button>
    <button type="button" data-tab="team">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M14.5 14.5c.8-.3 1.6-.5 2.5-.5 2.5 0 4 1.8 4 4.5"/></svg>
      <span>Team</span>
    </button>
  </nav>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
